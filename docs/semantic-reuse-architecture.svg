<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Khala cross-sandbox semantic reuse architecture</title>
  <desc id="desc">Two isolated Docker sandboxes share one central PostgreSQL and pgvector store. Sandbox A generates and stores an answer. Sandbox B sends a paraphrased prompt, retrieves the stored answer by semantic recall, and avoids a new chat completion.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="central" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172554" flood-opacity=".14"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#059669"/>
    </marker>
    <style>
      .ink { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .light { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .light-muted { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dbeafe; }
      .muted { fill: #596579; }
      .label { font-size: 16px; font-weight: 700; letter-spacing: .04em; }
      .body { font-size: 17px; }
      .small { font-size: 14px; }
      .title { font-size: 30px; font-weight: 800; }
      .card { fill: #ffffff; stroke: #dbe3f0; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <text x="60" y="64" class="ink title">One shared memory, two isolated agent environments</text>
  <text x="60" y="96" class="ink muted body">The experiment isolates local state while keeping only the Khala remote store common.</text>

  <!-- Box A -->
  <g filter="url(#shadow)">
    <rect x="55" y="155" width="310" height="330" rx="22" class="card"/>
    <rect x="55" y="155" width="310" height="62" rx="22" fill="#e0e7ff"/>
    <rect x="55" y="195" width="310" height="22" fill="#e0e7ff"/>
  </g>
  <circle cx="89" cy="186" r="16" fill="#4f46e5"/>
  <text x="89" y="192" text-anchor="middle" fill="#fff" class="ink" style="font-size:16px;font-weight:800">A</text>
  <text x="120" y="193" class="ink label">SANDBOX A</text>
  <text x="80" y="258" class="ink body" font-weight="700">Prompt A</text>
  <text x="80" y="286" class="ink muted small">“Analyze the structure and</text>
  <text x="80" y="307" class="ink muted small">purpose of Khala.”</text>
  <path d="M210 326 L210 355" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="100" y="360" width="220" height="54" rx="12" fill="#eef2ff"/>
  <text x="210" y="383" text-anchor="middle" class="ink body" font-weight="700">LLM generation</text>
  <text x="210" y="403" text-anchor="middle" class="ink muted small">600 tokens observed</text>
  <path d="M210 421 L210 449" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="80" y="474" class="ink muted small">user + assistant events</text>

  <!-- Central store -->
  <g filter="url(#shadow)">
    <rect x="430" y="135" width="340" height="370" rx="24" fill="url(#central)"/>
  </g>
  <text x="600" y="184" text-anchor="middle" class="light label">CENTRAL KHALA STORE</text>
  <text x="600" y="214" text-anchor="middle" class="light-muted body">PostgreSQL + pgvector</text>
  <g>
    <ellipse cx="600" cy="296" rx="92" ry="28" fill="#818cf8" opacity=".95"/>
    <path d="M508 296 v88 c0 16 41 28 92 28s92-12 92-28v-88" fill="#6366f1" opacity=".95"/>
    <ellipse cx="600" cy="384" rx="92" ry="28" fill="#6366f1"/>
    <path d="M508 326 c0 16 41 28 92 28s92-12 92-28" fill="none" stroke="#c7d2fe" stroke-width="2" opacity=".7"/>
    <text x="600" y="301" text-anchor="middle" class="light body" font-weight="700">events + embeddings</text>
    <text x="600" y="421" text-anchor="middle" class="light-muted small">semantic nearest-neighbor search</text>
  </g>
  <rect x="478" y="451" width="244" height="34" rx="17" fill="#312e81" stroke="#818cf8"/>
  <text x="600" y="474" text-anchor="middle" class="light small" font-weight="700">shared state boundary</text>

  <!-- A to store -->
  <path d="M366 327 C395 327 397 327 425 327" fill="none" stroke="#4f46e5" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="395" y="307" text-anchor="middle" class="ink muted small">sync + embed</text>

  <!-- Box B -->
  <g filter="url(#shadow)">
    <rect x="835" y="155" width="310" height="330" rx="22" class="card"/>
    <rect x="835" y="155" width="310" height="62" rx="22" fill="#d1fae5"/>
    <rect x="835" y="195" width="310" height="22" fill="#d1fae5"/>
  </g>
  <circle cx="869" cy="186" r="16" fill="#059669"/>
  <text x="869" y="192" text-anchor="middle" fill="#fff" class="ink" style="font-size:16px;font-weight:800">B</text>
  <text x="900" y="193" class="ink label">SANDBOX B</text>
  <text x="860" y="258" class="ink body" font-weight="700">Paraphrase B</text>
  <text x="860" y="286" class="ink muted small">“Look over Khala and explain</text>
  <text x="860" y="307" class="ink muted small">how it is organized.”</text>
  <path d="M990 326 L990 355" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="875" y="360" width="230" height="54" rx="12" fill="#ecfdf5"/>
  <text x="990" y="383" text-anchor="middle" class="ink body" font-weight="700">semantic recall</text>
  <text x="990" y="403" text-anchor="middle" class="ink muted small">no new chat completion</text>
  <path d="M990 421 L990 449" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="860" y="474" class="ink muted small">stored assistant response</text>

  <!-- B arrows -->
  <path d="M835 282 C805 282 802 282 775 282" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="805" y="262" text-anchor="middle" class="ink muted small">embed query</text>
  <path d="M775 410 C802 410 805 410 835 410" fill="none" stroke="#059669" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="805" y="446" text-anchor="middle" class="ink muted small">top-k answer</text>

  <!-- Bottom finding -->
  <rect x="55" y="560" width="1090" height="70" rx="18" fill="#172033"/>
  <circle cx="91" cy="595" r="16" fill="#34d399"/>
  <path d="M83 595 l6 6 11-13" fill="none" stroke="#052e25" stroke-width="3"/>
  <text x="125" y="590" class="ink" fill="#fff" style="font-size:20px;font-weight:800">Observed finding</text>
  <text x="125" y="615" class="ink" fill="#d1fae5" style="font-size:16px">B surfaced A’s stored analysis in the semantic top-2 across isolated containers.</text>
</svg>
