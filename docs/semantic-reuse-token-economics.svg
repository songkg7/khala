<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Khala observed token economics</title>
  <desc id="desc">A measured comparison: a fresh analysis used 600 chat tokens, while the reuse path required a semantic embedding lookup rather than another chat completion. The exact embedding token count was not returned by the CLI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#fff1f2"/></linearGradient>
    <linearGradient id="gen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="reuse" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#10b981"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#7c2d12" flood-opacity=".12"/></filter>
    <style>
      .ink { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #2a1b17; }
      .light { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; }
      .muted { fill: #765b51; }
      .title { font-size: 30px; font-weight: 800; }
      .label { font-size: 16px; font-weight: 800; letter-spacing: .05em; }
      .big { font-size: 42px; font-weight: 900; }
      .body { font-size: 17px; }
      .small { font-size: 14px; }
    </style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="60" y="65" class="ink title">The expensive part is generation — not lookup</text>
  <text x="60" y="97" class="ink muted body">One controlled run shows the direction of the economics. Repeat runs determine the production hit rate.</text>

  <!-- left card -->
  <g filter="url(#shadow)">
    <rect x="60" y="145" width="500" height="290" rx="22" fill="#fff" stroke="#fed7aa" stroke-width="2"/>
  </g>
  <rect x="60" y="145" width="500" height="60" rx="22" fill="#ffedd5"/>
  <rect x="60" y="183" width="500" height="22" fill="#ffedd5"/>
  <text x="94" y="183" class="ink label">FRESH GENERATION · BOX A</text>
  <text x="94" y="253" class="ink big">600</text>
  <text x="94" y="281" class="ink body" font-weight="700">chat tokens observed</text>
  <rect x="94" y="309" width="405" height="28" rx="14" fill="#ffedd5"/>
  <rect x="94" y="309" width="405" height="28" rx="14" fill="url(#gen)"/>
  <text x="94" y="372" class="ink muted small">22 prompt tokens + 578 completion tokens</text>
  <text x="94" y="398" class="ink muted small">OpenRouter reported cost: $0.0003501</text>

  <!-- right card -->
  <g filter="url(#shadow)">
    <rect x="640" y="145" width="500" height="290" rx="22" fill="#fff" stroke="#a7f3d0" stroke-width="2"/>
  </g>
  <rect x="640" y="145" width="500" height="60" rx="22" fill="#d1fae5"/>
  <rect x="640" y="183" width="500" height="22" fill="#d1fae5"/>
  <text x="674" y="183" class="ink label">REUSE LOOKUP · BOX B</text>
  <text x="674" y="253" class="ink big" fill="#047857">0</text>
  <text x="735" y="253" class="ink body" font-weight="700">new chat-completion tokens</text>
  <rect x="674" y="309" width="405" height="28" rx="14" fill="#d1fae5"/>
  <rect x="674" y="309" width="42" height="28" rx="14" fill="url(#reuse)"/>
  <text x="674" y="372" class="ink muted small">one semantic embedding lookup + stored response</text>
  <text x="674" y="398" class="ink muted small">Exact embedding token count: not exposed by CLI</text>

  <rect x="60" y="475" width="1080" height="48" rx="16" fill="#14532d"/>
  <text x="600" y="506" text-anchor="middle" class="light body" font-weight="800">Observed direction: replace repeated generation with shared retrieval when the answer is reusable.</text>
</svg>
