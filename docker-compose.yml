services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: khala-postgres
    environment:
      POSTGRES_USER: khala
      POSTGRES_PASSWORD: ${KHALA_POSTGRES_PASSWORD:?KHALA_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: khala
    ports:
      - "127.0.0.1:${KHALA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - khala_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khala -d khala"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  khala_pgdata:
