services:
  postgres:
    image: postgres:16
    container_name: khala-postgres
    environment:
      POSTGRES_USER: khala
      POSTGRES_PASSWORD: khala
      POSTGRES_DB: khala
    ports:
      - "5432:5432"
    volumes:
      - khala_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khala -d khala"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  khala_pgdata:
