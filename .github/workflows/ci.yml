name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.9 quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16@sha256:33198da2828a14c30348d2ccb4750833d5ed9a44c88d840a0e523d7417120337
        env:
          POSTGRES_USER: khala
          POSTGRES_PASSWORD: khala-ci-password
          POSTGRES_DB: khala_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khala -d khala_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      KHALA_CONFIG_DIR: /tmp/khala-config
      KHALA_DB: /tmp/khala.db
      KHALA_TEST_POSTGRES_DSN: postgresql://khala:khala-ci-password@127.0.0.1:5432/khala_test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
      TZ: UTC
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.9
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install from the locked Python 3.9 environment
        run: |
          python -m pip install --upgrade pip==25.2
          python -m pip install uv==0.10.9
          uv sync --locked --extra dev --python 3.9

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Type check
        run: .venv/bin/pyright

      - name: Run PostgreSQL integration tests
        run: .venv/bin/python -m unittest -v tests.test_postgres_integration

      - name: Test with branch coverage
        run: .venv/bin/coverage run -m unittest discover -s tests -v

      - name: Enforce coverage floor
        run: .venv/bin/coverage report

      - name: Run deterministic recall baseline
        run: .venv/bin/python -m khala eval --baseline
