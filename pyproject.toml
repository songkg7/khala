[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "khala"
version = "0.1.0"
description = "Local-first shared agent memory"
requires-python = ">=3.9"

[project.scripts]
khala = "khala.cli:main"

[tool.setuptools]
packages = [
    "khala",
    "khala.adapters",
]

[tool.ruff]
line-length = 100

target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "standard"
